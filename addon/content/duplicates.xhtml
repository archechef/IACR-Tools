<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
	The report of duplicate papers: one card per group of copies and versions,
	with Merge / Link / Not the Same Paper. Plain HTML like the other windows;
	the report and all labels come from the caller through window.arguments[0]
	(see DuplicatesView in src/ui/duplicates.js).
-->
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8"/>
	<title></title>
	<link rel="stylesheet" href="duplicates.css"/>
</head>
<body>
	<header>
		<div class="heading">
			<h1 id="headline"></h1>
			<p id="status" role="status" aria-live="polite"></p>
		</div>
		<button id="link-all" type="button"></button>
	</header>
	<main id="groups" tabindex="0"></main>
	<p id="empty" hidden="hidden"></p>
	<footer>
		<span class="spacer"></span>
		<button id="close" type="button" class="default"></button>
	</footer>
	<script src="duplicates.js"/>
</body>
</html>
