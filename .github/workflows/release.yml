name: Release

# Push a tag matching package.json's version (e.g. v1.3.0) to publish a release.
# The .xpi and updates.json attached to it are what PLUGIN.updateURL / xpiURL point to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run build
      - run: npm test
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/zotero-iacr-tools-*.xpi build/updates.json \
            --title "$GITHUB_REF_NAME" --generate-notes
